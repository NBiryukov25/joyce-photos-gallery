<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Sunday Masquerade · Sheryl Joyce</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #060404; overflow: hidden; }
    .shell { position: relative; width: 100vw; height: 100vh; height: 100dvh; background: #060404; overflow: hidden; cursor: pointer; }
    .slide { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.7s ease; }
    .slide.active { opacity: 1; }
    .slide img { max-width: 100%; max-height: 100%; display: block; user-select: none; -webkit-user-drag: none; pointer-events: none; }
    .slide video { max-width: 100%; max-height: 100%; display: block; }
    .top-ui { position: absolute; top: 0; left: 0; right: 0; z-index: 10; padding: 1.6rem 2.5rem 4rem; background: linear-gradient(to bottom, rgba(6,4,4,0.72) 0%, transparent 100%); pointer-events: none; }
    .gallery-title { font-family: 'Cormorant Garamond', serif; font-size: 0.78rem; font-weight: 300; letter-spacing: 0.32em; text-transform: uppercase; color: rgba(247,241,238,0.48); }
    .bottom-ui { position: absolute; bottom: 0; left: 0; right: 0; z-index: 10; padding: 4rem 3rem 1.4rem; background: linear-gradient(to top, rgba(6,4,4,0.82) 0%, transparent 100%); display: flex; flex-direction: column; align-items: center; gap: 0.6rem; pointer-events: none; }
    .caption-el { font-family: 'Cormorant Garamond', serif; font-size: 1.08rem; font-weight: 300; font-style: italic; color: rgba(247,241,238,0.0); letter-spacing: 0.04em; text-align: center; max-width: 520px; line-height: 1.58; transition: color 0.8s ease 1.5s; }
    .caption-el.visible { color: rgba(247,241,238,0.92); }
    .counter-el { font-family: 'Jost', sans-serif; font-size: 0.6rem; font-weight: 200; letter-spacing: 0.26em; color: rgba(247,241,238,0.26); }
    .edge-control { position: absolute; top: 50%; z-index: 20; width: 30px; height: 96px; padding: 0; border: 0; background: transparent; transform: translateY(-50%); cursor: pointer; opacity: 1; transition: opacity 0.5s ease; }
    .edge-control-left { left: 0; } .edge-control-right { right: 0; }
    .edge-control svg { width: 14px; height: 48px; fill: none; stroke: rgba(255,255,255,0.38); stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; transition: stroke 0.2s ease; }
    .edge-control:hover svg { stroke: rgba(255,255,255,0.92); }
    .topbar-controls { position: absolute; top: 1.3rem; right: 1.3rem; z-index: 20; display: flex; align-items: center; gap: 0.4rem; opacity: 1; transition: opacity 0.5s ease; }
    .ui-btn { appearance: none; border: 1px solid rgba(255,255,255,0.16); border-radius: 999px; background: rgba(6,4,4,0.45); color: rgba(247,241,238,0.48); padding: 0.26rem 0.62rem; font-family: 'Jost', sans-serif; font-size: 0.6rem; font-weight: 300; letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer; text-decoration: none; display: inline-block; transition: color 0.2s, border-color 0.2s; white-space: nowrap; }
    .ui-btn:hover { color: rgba(247,241,238,0.9); border-color: rgba(255,255,255,0.4); }
    .shell.controls-hidden .topbar-controls,
    .shell.controls-hidden .edge-control { opacity: 0; pointer-events: none; }
    .pause-badge { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 30; font-family: 'Jost', sans-serif; font-size: 0.62rem; letter-spacing: 0.3em; text-transform: uppercase; color: rgba(247,241,238,0.55); background: rgba(6,4,4,0.6); border: 1px solid rgba(255,255,255,0.14); border-radius: 999px; padding: 0.4rem 1rem; pointer-events: none; opacity: 0; transition: opacity 0.4s ease; }
    .shell.paused .pause-badge { opacity: 1; }
    @media (max-width: 600px) { .gallery-title { font-size: 0.7rem; } .caption-el { font-size: 0.95rem; } .topbar-controls { top: 0.9rem; right: 0.9rem; } .ui-btn { font-size: 0.56rem; padding: 0.22rem 0.5rem; } }
  </style>
</head>
<body>
<div class="shell" id="shell">
  <div class="top-ui"><div class="gallery-title">The Sunday Masquerade</div></div>
  <div class="bottom-ui">
    <div class="caption-el" id="caption-el"></div>
    <div class="counter-el" id="counter-el"></div>
  </div>
  <div class="pause-badge" id="pause-badge">Paused</div>
  <button class="edge-control edge-control-left" id="prev-btn" aria-label="Previous photograph">
    <svg viewBox="0 0 24 48" aria-hidden="true"><path d="M18 3 L5 24 L18 45"/></svg>
  </button>
  <button class="edge-control edge-control-right" id="next-btn" aria-label="Next photograph">
    <svg viewBox="0 0 24 48" aria-hidden="true"><path d="M6 3 L19 24 L6 45"/></svg>
  </button>
  <div class="topbar-controls">
    <button class="ui-btn" id="autoplay-btn">Pause</button>
    <button class="ui-btn" id="mute-btn">🔇</button>
    <button class="ui-btn" id="fs-btn">Fullscreen</button>
    <a class="ui-btn" href="../gallery.html">← Galleries</a>
  </div>
</div>
<script>
(function () {
  var slides = [

    { filename: 'photo-20260816-065650.jpg', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'Sunday is off day for the helper and the boss. She dresses the way he wants and it\'s playtime.' },

    { filename: 'photo-20260816-065652-01.jpg', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'No demanding household tasks but she\'s very warm and moist inside.' },

    { filename: 'photo-20260816-065655-02.jpg', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'A heavy, tropical heat radiating from her wet Filipino center; an invitation that cannot be ignored.' },

    { filename: 'photo-20260816-065657-03.jpg', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'You may want to stay comfy today because boss wants to mess with you.' },

    { filename: 'photo-20260816-070409.jpg', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'She should be with her friends at Victoria Park on Sunday — her off day. But she is in her room messing around with her boss.' },

    { filename: 'photo-20260816-070411-01.jpg', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: '' },

    { filename: 'photo-20260816-070413-02.jpg', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: '' },

    { filename: 'photo-20260816-070501.jpg', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: '' },

    { filename: 'photo-20260816-071043-02.jpg', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: '' },

    { filename: 'photo-20260816-071045-03.jpg', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: '' },

    { filename: 'photo-20260816-071047-04.jpg', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: '' },

    { filename: 'photo-20260816-072214.jpg', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: '' },

    { filename: 'photo-20260816-072216-01.jpg', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: '' },

    { filename: 'photo-20260816-072218-02.jpg', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: '' },

    { filename: 'photo-20260816-072222-04.jpg', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'She should be with her friends at Victoria Park on Sunday - her off day. But she is in her room messing around with her boss.' },

    { filename: 'photo-20260816-072337.jpg', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: '' },

    { filename: 'photo-20260816-072339-01.jpg', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: '' },

    { filename: 'photo-20260816-072726.jpg', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: '' },

    { filename: 'photo-20260816-072833.jpg', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: '' },

    { filename: 'photo-20260816-072835-01.jpg', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: '' },

    { filename: 'photo-20260816-072838-02.jpg', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: '' },

    { filename: 'photo-20260816-072840-03.jpg', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: '' },

    { filename: 'photo-20260816-164832.jpg', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: '' },

    { filename: 'photo-20260816-164834-01.jpg', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: '' },

    { filename: 'photo-20260816-164837-02.jpg', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'Her soon to be husband will not know it’s not his kid.' },

    { filename: 'photo-20260816-172941.jpg', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: '' },

    { filename: 'photo-20260816-173517.jpg', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: '' },

    { filename: 'photo-20260816-173519-01.jpg', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: '' },
    ];
  var BASE = '../assets/The-Sunday-Masquerade/';
  var VIDEO_EXTS = ['mp4','mov','webm','m4v'];
  var ZOOM_MS = 10000;
  /* Variable hold times — cycle through so each slide feels different */
  var HOLD_TIMES = [10000, 14000, 8000, 13000, 16000, 9000, 12000, 11000];
  var MOTIONS = [
    { ox: '50%', oy: '50%', from: 'scale(1.0)',              to: 'scale(1.22)' },
    { ox: '28%', oy: '50%', from: 'scale(1.08) translateX(-2%)', to: 'scale(1.18) translateX(2%)' },
    { ox: '72%', oy: '50%', from: 'scale(1.08) translateX(2%)', to: 'scale(1.18) translateX(-2%)' },
    { ox: '50%', oy: '35%', from: 'scale(1.05) translateY(-1%)', to: 'scale(1.2) translateY(2%)' },
  ];
  var shell     = document.getElementById('shell');
  var captionEl = document.getElementById('caption-el');
  var counterEl = document.getElementById('counter-el');
  var prevBtn   = document.getElementById('prev-btn');
  var nextBtn   = document.getElementById('next-btn');
  var autoBtn   = document.getElementById('autoplay-btn');
  var muteBtn   = document.getElementById('mute-btn');
  var fsBtn     = document.getElementById('fs-btn');
  var bottomUI  = document.querySelector('.bottom-ui');
  var current = 0, autoTimer = null, videoMuted = true, hideTimer = null;
  var slideEls = [], mediaEls = [], activeAnim = null;

  /* ── Controls visibility ── */
  function showControls() {
    shell.classList.remove('controls-hidden');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () { shell.classList.add('controls-hidden'); }, 4000);
  }
  shell.addEventListener('mousemove', showControls);

  /* ── Build slide elements ── */
  slides.forEach(function (s, i) {
    var div = document.createElement('div'); div.className = 'slide';
    var ext = s.filename.split('.').pop().toLowerCase(); var el;
    if (VIDEO_EXTS.indexOf(ext) !== -1) {
      el = document.createElement('video'); el.src = BASE + encodeURIComponent(s.filename);
      el.loop = true; el.muted = true; el.playsInline = true;
    } else {
      el = document.createElement('img'); el.src = BASE + encodeURIComponent(s.filename);
      el.alt = 'The Sunday Masquerade — ' + (i + 1); el.draggable = false;
    }
    div.appendChild(el); shell.insertBefore(div, bottomUI);
    slideEls.push(div); mediaEls.push(el);
  });

  /* ── Ken Burns ── */
  function startZoom(i) {
    var el = mediaEls[i]; if (!el || el.tagName === 'VIDEO') return;
    if (activeAnim) { try { activeAnim.cancel(); } catch (e) {} activeAnim = null; }
    el.style.transform = '';
    var m = MOTIONS[i % MOTIONS.length];
    el.style.transformOrigin = m.ox + ' ' + m.oy;
    activeAnim = el.animate([{ transform: m.from }, { transform: m.to }],
      { duration: ZOOM_MS, easing: 'ease-in-out', fill: 'forwards' });
  }
  function resetMedia(i) {
    var el = mediaEls[i]; if (!el) return;
    if (el.tagName === 'VIDEO') { try { el.pause(); el.currentTime = 0; } catch (e) {} }
    el.style.transform = '';
  }

  /* ── Navigation ── */
  function goTo(n) {
    var old = current;
    current = ((n % slides.length) + slides.length) % slides.length;
    slideEls[old].classList.remove('active'); resetMedia(old);
    captionEl.classList.remove('visible');
    slideEls[current].classList.add('active'); startZoom(current);
    var cap = slides[current].caption || '';
    captionEl.textContent = cap; captionEl.style.display = cap ? '' : 'none';
    if (cap) { setTimeout(function () { captionEl.classList.add('visible'); }, 50); }
    counterEl.textContent = (current + 1) + ' / ' + slides.length;
    var vid = mediaEls[current];
    if (vid && vid.tagName === 'VIDEO') { vid.muted = videoMuted; try { vid.play(); } catch (e) {} }
  }

  /* ── Autoplay with variable hold times ── */
  function scheduleNext() {
    var delay = HOLD_TIMES[current % HOLD_TIMES.length];
    autoTimer = setTimeout(function () { goTo(current + 1); scheduleNext(); }, delay);
  }
  function startAuto() {
    if (autoTimer !== null) return;
    shell.classList.remove('paused');
    autoBtn.textContent = 'Pause';
    scheduleNext();
  }
  function stopAuto() {
    clearTimeout(autoTimer); autoTimer = null;
    shell.classList.add('paused');
    autoBtn.textContent = 'Play';
  }
  function toggleAuto() { autoTimer !== null ? stopAuto() : startAuto(); }

  /* Arrow buttons: navigate and reset the autoplay countdown */
  function nudge(dir) {
    goTo(current + dir);
    if (autoTimer !== null) { clearTimeout(autoTimer); autoTimer = null; scheduleNext(); }
  }
  prevBtn.addEventListener('click', function (e) { e.stopPropagation(); showControls(); nudge(-1); });
  nextBtn.addEventListener('click', function (e) { e.stopPropagation(); showControls(); nudge(1); });
  autoBtn.addEventListener('click', function (e) { e.stopPropagation(); showControls(); toggleAuto(); });
  muteBtn.addEventListener('click', function (e) {
    e.stopPropagation(); showControls();
    videoMuted = !videoMuted; muteBtn.textContent = videoMuted ? '🔇' : '🔊';
    var vid = mediaEls[current]; if (vid && vid.tagName === 'VIDEO') { vid.muted = videoMuted; }
  });

  /* ── Fullscreen ── */
  function toggleFS() {
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else { (shell.requestFullscreen || shell.webkitRequestFullscreen).call(shell); }
  }
  fsBtn.addEventListener('click', function (e) { e.stopPropagation(); showControls(); toggleFS(); });
  document.addEventListener('fullscreenchange', function () { fsBtn.textContent = document.fullscreenElement ? 'Exit' : 'Fullscreen'; });

  /* ── Keyboard ── */
  window.addEventListener('keydown', function (e) {
    showControls();
    if (e.key === 'ArrowLeft')       { nudge(-1); }
    else if (e.key === 'ArrowRight')  { nudge(1); }
    else if (e.key === 'f' || e.key === 'F') { toggleFS(); }
    else if (e.key === ' ')           { e.preventDefault(); toggleAuto(); }
  });

  /* ── Touch: swipe = navigate+pause  |  tap = toggle pause ── */
  var tx = null, ty = null;
  shell.addEventListener('touchstart', function (e) {
    tx = e.touches[0].clientX; ty = e.touches[0].clientY; showControls();
  }, { passive: true });
  shell.addEventListener('touchend', function (e) {
    if (tx === null) return;
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) < 12 && Math.abs(dy) < 12) {
      toggleAuto();   /* tap anywhere on image toggles pause */
    } else if (Math.abs(dx) > 44) {
      nudge(dx < 0 ? 1 : -1); stopAuto();  /* swipe navigates and pauses */
    }
    tx = null; ty = null;
  }, { passive: true });

  /* ── Init ── */
  showControls();
  goTo(0); startAuto();
})();
</script>
</body>
</html>
