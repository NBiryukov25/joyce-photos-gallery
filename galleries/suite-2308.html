<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suite 2308 · Sheryl Joyce</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #060404; overflow: hidden; }
    .shell { position: relative; width: 100vw; height: 100vh; height: 100dvh; background: #060404; overflow: hidden; }
    .slide { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.9s ease; }
    .slide.active { opacity: 1; }
    .slide img { max-width: 100%; max-height: 100%; display: block; user-select: none; -webkit-user-drag: none; pointer-events: none; }
    .slide video { max-width: 100%; max-height: 100%; display: block; }
    .top-ui { position: absolute; top: 0; left: 0; right: 0; z-index: 10; padding: 1.6rem 2.5rem 4rem; background: linear-gradient(to bottom, rgba(6,4,4,0.55) 0%, transparent 100%); pointer-events: none; transition: opacity 0.6s ease; }
    .gallery-title { font-family: 'Cormorant Garamond', serif; font-size: 0.78rem; font-weight: 300; letter-spacing: 0.32em; text-transform: uppercase; color: rgba(247,241,238,0.38); }
    .bottom-ui { position: absolute; bottom: 0; left: 0; right: 0; z-index: 10; padding: 4rem 3rem 1.4rem; background: linear-gradient(to top, rgba(6,4,4,0.65) 0%, transparent 100%); display: flex; flex-direction: column; align-items: center; gap: 0.6rem; pointer-events: none; transition: opacity 0.6s ease; }
    .caption-el { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; font-weight: 300; font-style: italic; color: rgba(247,241,238,0.88); letter-spacing: 0.04em; text-align: center; max-width: 540px; line-height: 1.65; }
    .counter-el { font-family: 'Jost', sans-serif; font-size: 0.6rem; font-weight: 200; letter-spacing: 0.26em; color: rgba(247,241,238,0.2); }
    .edge-control { position: absolute; top: 50%; z-index: 20; width: 30px; height: 96px; padding: 0; border: 0; background: transparent; transform: translateY(-50%); cursor: pointer; transition: opacity 0.6s ease; }
    .edge-control-left { left: 0; } .edge-control-right { right: 0; }
    .edge-control svg { width: 14px; height: 48px; fill: none; stroke: rgba(255,255,255,0.28); stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; transition: stroke 0.3s ease; }
    .edge-control:hover svg { stroke: rgba(255,255,255,0.75); }
    .topbar-controls { position: absolute; top: 1.3rem; right: 1.3rem; z-index: 20; display: flex; align-items: center; gap: 0.4rem; transition: opacity 0.6s ease; }
    .ui-btn { appearance: none; border: 1px solid rgba(255,255,255,0.12); border-radius: 999px; background: rgba(6,4,4,0.35); color: rgba(247,241,238,0.38); padding: 0.26rem 0.62rem; font-family: 'Jost', sans-serif; font-size: 0.6rem; font-weight: 300; letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer; text-decoration: none; display: inline-block; transition: color 0.2s, border-color 0.2s; white-space: nowrap; }
    .ui-btn:hover { color: rgba(247,241,238,0.85); border-color: rgba(255,255,255,0.35); }
    .ui-hidden { opacity: 0; pointer-events: none; }
    @media (max-width: 600px) { .gallery-title { font-size: 0.7rem; } .caption-el { font-size: 0.98rem; } .topbar-controls { top: 0.9rem; right: 0.9rem; } .ui-btn { font-size: 0.56rem; padding: 0.22rem 0.5rem; } }
  </style>
</head>
<body>
<div class="shell" id="shell">
  <div class="top-ui" id="top-ui"><div class="gallery-title">Suite 2308</div></div>
  <div class="bottom-ui" id="bottom-ui">
    <div class="caption-el" id="caption-el"></div>
    <div class="counter-el" id="counter-el"></div>
  </div>
  <button class="edge-control edge-control-left" id="prev-btn" aria-label="Previous photograph">
    <svg viewBox="0 0 24 48" aria-hidden="true"><path d="M18 3 L5 24 L18 45"/></svg>
  </button>
  <button class="edge-control edge-control-right" id="next-btn" aria-label="Next photograph">
    <svg viewBox="0 0 24 48" aria-hidden="true"><path d="M6 3 L19 24 L6 45"/></svg>
  </button>
  <div class="topbar-controls" id="topbar">
    <button class="ui-btn" id="autoplay-btn">Auto ★</button>
    <button class="ui-btn" id="mute-btn">🔇</button>
    <button class="ui-btn" id="fs-btn">Fullscreen</button>
    <a class="ui-btn" href="../gallery.html">← Galleries</a>
  </div>
</div>
<script>
(function () {
  var slides = [
    { filename: '1HljdxGfPcJPvElnGfMnvHQN-5DZsEUMh.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'The whole city lit up behind you, and all I could see was you. That look you give me — like you already know what I\'m thinking.' },
    { filename: '1ihHC1tcJHsnl-92Q_80pm6oESOXE_DeN.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'Leaning into the night like it belongs to you. The lace, the city, those eyes... there\'s no version of this moment I\'d trade.' },
    { filename: '1akmdvo46rfs6AWXAvhmmaVBysRbit3db.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'You stepped out in that ivory lace and the entire skyline became backdrop. You\'ve always been the main attraction.' },
    { filename: '1u0dEgywcPQN8OIP_osEK7yAHCrXn_dgH.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'Champagne silk against a million city lights. You look like a dream I keep choosing to stay inside.' },
    { filename: '1rG65WXmpwPYpTwGDMFhkz8Bwra0qm9jR.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'The amber light behind you, the way your hands rest — soft and certain. There\'s nowhere I\'d rather come home to.' },
    { filename: '13DjpR2jQaTkgNb_tcAbtohORfceKJi-q.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'Neon signs and a midnight skyline, and you standing there like none of it compares to you. It doesn\'t.' },
    { filename: '1vEC3-mnA37gAvgtwDxQmKitFBPaZk-pa.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'The whole city spread out like an offering behind you — and you lean on that railing like a woman who\'s earned every view she takes.' },
    { filename: '1nQe_5JuzyxSBSjG3mQBGgjEMP8kuK2p5.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: '\'One more thing,\' you say — and whatever it is, the answer is already yes. That smile knows exactly what it does to me.' },
    { filename: '1GbMM5pOb0C4frTHE341c3e9ODxlq1vwe.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'You pressed your hand to the window and looked out like you were reading the city\'s secrets. I was reading you.' },
    { filename: '1tBieNxkw2Qt6h3ZpAUPcqLgUKd5F1O_M.jpg', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'Silk from shoulder to ankle, a city tower glowing just for you. You sat like royalty and looked at me like I was the view.' },
    { filename: '1OKajBXweYgY5oFztJVh8nNapdJ0qoFLX.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'You touched the frame like you were holding the night still. I wanted to hold you still. Just like that. Forever.' },
    { filename: '1jBqJ0BUxCZXxHHGhDJrp2jSMQtRTLN4H.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'Half warm light, half cold city — and all of you impossibly beautiful between them. The contrast never stood a chance.' },
    { filename: '1ITUleiIdVC2ZsULIC2IvAz84TuUiKr2R.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'Hand at your chin, eyes just past the lens — thinking something I want you to say out loud. Take your time. I\'m not going anywhere.' },
    { filename: '1YOwaRhWFTK8j4k4iBQ0JVORXGnwpr8GE.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'Barefoot on hotel sheets in a full silk set, with the city lit up behind you. You made the suite feel like a world I never want to leave.' },
    { filename: '1G1BlniE2yGwDLK6duXbA8M0CCQmgrCGl.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'Tokyo Tower burning orange behind you, you sitting on the bed like a painting. I\'ve never been more grateful to be in the same room.' },
    { filename: '1pNehV9S6vPa6W8EWmM_Uaihx38UWWPHp.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'Legs crossed, shoes off, completely at ease — and still the most stunning woman in any room, any city, any hour.' },
    { filename: '1f_MZXlOeAfOJpBjz2pC8MZjxgzamaPIE.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'That easy confidence — one knee up, chin tilted, like you\'re deciding whether to let me stare a little longer. Please. Let me.' },
    { filename: '1paw8sZa5B4kvE7UShwmYfMTfZe-OLtjX.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'The city turned blue behind you and you sat there glowing against it. Effortless. Every single time.' },
    { filename: '1lpiV4CDEQEkmmtQZERx-7iXeaNdNtIM9.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'You picked up those chopsticks and looked at me like a question I\'d spend all night answering. Yes. Always yes.' },
    { filename: '1Aj1uN_WOkkAG90hKg7nVxu8N_VxaaEyl.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'Early morning light pushing through the curtains, you sitting on the bed like you haven\'t decided yet if the day gets to start. Stay.' },
    { filename: '1BBpbWnYf_FG50LAk-jnqDHwS_Cgst6dy.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'The sash still in your hand, the city just beginning to darken outside — and that smile that says you know exactly how this night ends.' },
    { filename: '13MZbejic4196TYw73VzQh-9azNHlX11W.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'You ran your fingers through your hair and the lamplight caught every strand. I caught my breath.' },
    { filename: '1tA2psZndIsk7KIZwXtwOWZlv82JK00-F.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'That playful tilt, the way you hold the brush like a secret. You\'re thinking something mischievous and I love every second of it.' },
    { filename: '1L-_vSLGXo6a_MJKVOXLFQL9dHRmss7A8.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'You look at me like that and every coherent thought I had just... leaves. Stay exactly as you are.' },
    { filename: '1V-txQCsNCrlvYFjoK976fXysX2aaMp8f.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'That smirk. You know what that smirk does. You\'ve always known.' },
    { filename: '1zu2kU_zzjI2RMQDtw5B88m3tNPN4L9LQ.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'One finger hooked on the strap, eyes holding mine — you could pull the whole world undone with a look like that.' },
    { filename: '1jfjO35brIivoBGLgGu1gKRDVIizF1zSy.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'The lamp behind you warm and low, your smile even warmer. The city outside had no idea how much light was inside this room.' },
    { filename: '1vPP-QB8AZiYrUlZMhmnY6KP8NcxgW1FF.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'You looked straight through the camera and into something only I\'m supposed to see. I\'ll keep it safe.' },
    { filename: '1UWDjwqrYrVLFM083NrW9kq3UQLT5K3-e.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'Finger to your lips — half shush, half invitation. Either way I\'m listening. I\'m always listening to you.' },
    { filename: '1iIctp1-ciOnX9MO8ulOeqK_zDbwdUsRn.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'No pose, no pretense. Just you, at ease in the room we shared, looking like everything I wanted to come back to.' },
    { filename: '1VFtrKMLWpiLHl7_bRVbfshyUy7iQ_LEV.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'There\'s something about the way you sit when you think no one\'s watching — open, unhurried, entirely yourself. That version of you undoes me.' },
    { filename: '1adrO7uKjPc6YlXxjy07GVSfxvMyHaQr2.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'Champagne silk against cold marble, gold doors behind you — you made the hotel look like it was dressed for you.' },
    { filename: '14HJ6YdEfXkCPcK2rRKjZ-wnjcfuwAS4a.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'That blush lace, that touch at the strap — like you\'re about to say something or undo something. My heart can\'t pick which it wants more.' },
    { filename: '1EMqImkRkeFyiNzCN2330hFr0MjF4TTVS.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'Every time I turn a corner and see you, it hits the same. Like the first time. Like I never get used to how beautiful you are.' },
    { filename: '15BlFI_gdcu0jwc9uvcbpBS8jEH5D9itg.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'A thin gold necklace, a delicate bracelet, silk the color of warm sand — and that look like you\'ve been waiting for me to notice. I always notice.' },
    { filename: '1J1RJh-wcOc2aajTbVTPzlzV7FZv9nVD8.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'You glanced back over your shoulder in that hallway and the whole hotel fell away. Just you, just that look, just that curve of your smile.' },
    { filename: '1rpGDh8-1jjcRcy4YbtpVqSiX5qnS3D4T.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'You were walking away and looked back — and I realized I\'d follow that look anywhere it led.' },
    { filename: '1yOxhBDMqGumnbQTbHjnqqOVTegrISra_.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'Half-turned at the door, the amber corridor stretching behind you, gold silk on your skin — you looked like a secret I was lucky enough to know.' },
    { filename: '1qw0pBDYw3t7FLlidJrS9mrXAWZySig48.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'Head to toe in gold silk, walking through that corridor like the whole night was choreographed just for this. For you. It was.' },
    { filename: '186dbwF1WyqidXuYmAJ-z1lDTierL-Thf.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'Two lamps trying to compete with you. They lost.' },
    { filename: '15XWPnbfTQ0jg-Oy9iQJGcp3-iCJr94iB.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'Tokyo Skytree rising blue into the night, and you — white lace, dark eyes, soft mouth — outshining every light in the frame.' },
    { filename: '1lZvfL7yGOto2fmFPCF0srtxTnsdOXJc7.png', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'The city never sleeps and neither does the way I feel standing across a room from you. Tokyo in the window. You in the light. Perfect.' },
    { filename: '1C-CcUMM7jj1r6Eiwh2yRIb_rWSEcfOUz.jpg', focalX: 50, focalY: 42, zoomEnd: 1.28, caption: 'Black lace, a sliver of skin, and the whole electric city spread out beneath you. You smiled at me and I forgot every skyline I\'ve ever seen.' }
  ];
  var BASE = '../assets/Suite-2308/';
  var VIDEO_EXTS = ['mp4','mov','webm','m4v'];
  var ZOOM_MS = 12000, AUTOPLAY_MS = 12000;
  var shell = document.getElementById('shell');
  var captionEl = document.getElementById('caption-el');
  var counterEl = document.getElementById('counter-el');
  var prevBtn = document.getElementById('prev-btn');
  var nextBtn = document.getElementById('next-btn');
  var autoBtn = document.getElementById('autoplay-btn');
  var muteBtn = document.getElementById('mute-btn');
  var fsBtn = document.getElementById('fs-btn');
  var controlEls = [document.getElementById('top-ui'), document.getElementById('bottom-ui'), document.getElementById('topbar'), prevBtn, nextBtn];
  var current = 0, autoTimer = null, videoMuted = true, hideTimer = null;
  var slideEls = [], mediaEls = [], activeAnim = null;
  var bottomUI = document.querySelector('.bottom-ui');
  function showControls() {
    controlEls.forEach(function (el) { el.classList.remove('ui-hidden'); });
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () { controlEls.forEach(function (el) { el.classList.add('ui-hidden'); }); }, 3000);
  }
  shell.addEventListener('mousemove', showControls);
  shell.addEventListener('touchstart', showControls, { passive: true });
  showControls();
  slides.forEach(function (s, i) {
    var div = document.createElement('div'); div.className = 'slide';
    var ext = s.filename.split('.').pop().toLowerCase(); var el;
    if (VIDEO_EXTS.indexOf(ext) !== -1) {
      el = document.createElement('video'); el.src = BASE + encodeURIComponent(s.filename);
      el.loop = true; el.muted = true; el.playsInline = true;
    } else {
      el = document.createElement('img'); el.src = BASE + encodeURIComponent(s.filename);
      el.alt = 'Suite 2308 — ' + (i + 1); el.draggable = false;
    }
    div.appendChild(el); shell.insertBefore(div, bottomUI);
    slideEls.push(div); mediaEls.push(el);
  });
  function startZoom(i) {
    var el = mediaEls[i], s = slides[i];
    if (!el || el.tagName === 'VIDEO') return;
    if (activeAnim) { try { activeAnim.cancel(); } catch (e) {} activeAnim = null; }
    el.style.transform = '';
    el.style.transformOrigin = s.focalX + '% ' + s.focalY + '%';
    activeAnim = el.animate(
      [{ transform: 'scale(1.0)', offset: 0 }, { transform: 'scale(' + s.zoomEnd + ')', offset: 0.5 }, { transform: 'scale(1.01)', offset: 1 }],
      { duration: ZOOM_MS, easing: 'ease-in-out', fill: 'forwards' }
    );
  }
  function resetMedia(i) { var el = mediaEls[i]; if (!el) return; if (el.tagName === 'VIDEO') { try { el.pause(); el.currentTime = 0; } catch (e) {} } el.style.transform = ''; }
  function goTo(n) {
    var old = current; current = ((n % slides.length) + slides.length) % slides.length;
    slideEls[old].classList.remove('active'); resetMedia(old);
    slideEls[current].classList.add('active'); startZoom(current);
    var cap = slides[current].caption || ''; captionEl.textContent = cap; captionEl.style.display = cap ? '' : 'none';
    counterEl.textContent = (current + 1) + ' / ' + slides.length;
    var vid = mediaEls[current]; if (vid && vid.tagName === 'VIDEO') { vid.muted = videoMuted; try { vid.play(); } catch (e) {} }
  }
  function nudge(dir) { goTo(current + dir); if (autoTimer) { stopAuto(); startAuto(); } }
  prevBtn.addEventListener('click', function () { nudge(-1); });
  nextBtn.addEventListener('click', function () { nudge(1); });
  function startAuto() { if (autoTimer) return; autoTimer = setInterval(function () { goTo(current + 1); }, AUTOPLAY_MS); autoBtn.textContent = 'Pause ★'; }
  function stopAuto() { clearInterval(autoTimer); autoTimer = null; autoBtn.textContent = 'Auto ★'; }
  autoBtn.addEventListener('click', function () { autoTimer ? stopAuto() : startAuto(); });
  muteBtn.addEventListener('click', function () { videoMuted = !videoMuted; muteBtn.textContent = videoMuted ? '🔇' : '🔊'; var vid = mediaEls[current]; if (vid && vid.tagName === 'VIDEO') { vid.muted = videoMuted; } });
  function toggleFS() { if (document.fullscreenElement) { document.exitFullscreen(); } else { (shell.requestFullscreen || shell.webkitRequestFullscreen).call(shell); } }
  fsBtn.addEventListener('click', toggleFS);
  document.addEventListener('fullscreenchange', function () { fsBtn.textContent = document.fullscreenElement ? 'Exit' : 'Fullscreen'; });
  window.addEventListener('keydown', function (e) { if (e.key === 'ArrowLeft') { nudge(-1); } else if (e.key === 'ArrowRight') { nudge(1); } else if (e.key === 'f' || e.key === 'F') { toggleFS(); } else if (e.key === ' ') { e.preventDefault(); autoTimer ? stopAuto() : startAuto(); } });
  var tx = null;
  shell.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; }, { passive: true });
  shell.addEventListener('touchend', function (e) { if (tx === null) return; var dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 44) nudge(dx < 0 ? 1 : -1); tx = null; }, { passive: true });
  goTo(0);
})();
</script>
</body>
</html>
