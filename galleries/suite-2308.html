<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suite 2308 · Sheryl Joyce</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #060404; color: #f7f1ee; font-family: 'Cormorant Garamond', serif; overflow: hidden; }
    .slideshow-shell { position: relative; width: 100vw; height: 100vh; height: 100dvh; }

    /* ── top bar ── */
    .topbar { position: absolute; top: 0; left: 0; right: 0; z-index: 20; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 1.25rem; background: rgba(10,8,6,0.55); }
    .topbar h1 { margin: 0; font-size: 1.1rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45vw; }
    .topbar-actions { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
    .topbar-btn { appearance: none; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.07); color: #f7f1ee; padding: 0.4rem 0.75rem; border-radius: 999px; font-size: 0.78rem; letter-spacing: 0.1em; cursor: pointer; transition: background 0.2s; text-decoration: none; display: inline-flex; align-items: center; }
    .topbar-btn:hover { background: rgba(255,255,255,0.14); }

    /* ── photo area ── */
    .slide-frame { position: absolute; top: 52px; bottom: 54px; left: 0; right: 0; display: flex; align-items: center; justify-content: center; background: #080606; overflow: hidden; }
    .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.5s ease; display: flex; align-items: center; justify-content: center; }
    .slide.active { opacity: 1; }
    .slide img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
    .slide video { max-width: 100%; max-height: 100%; }

    /* ── caption ── */
    .caption-overlay { position: absolute; bottom: 0; left: 0; right: 0; z-index: 10; padding: 2.5rem 1.25rem 0.85rem; background: linear-gradient(transparent, rgba(6,4,4,0.88)); max-height: 50%; overflow-y: auto; pointer-events: auto; }
    .caption-text { font-size: 1.05rem; line-height: 1.5; color: rgba(247,241,238,0.95); text-align: center; }

    /* ── controls bar ── */
    .bottom-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 54px; z-index: 20; display: flex; align-items: center; justify-content: space-between; padding: 0 1rem; background: rgba(6,4,4,0.92); }
    .nav-btn { width: 2.5rem; height: 2.5rem; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; background: rgba(255,255,255,0.07); color: #f7f1ee; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s; text-decoration: none; appearance: none; line-height: 1; }
    .nav-btn:hover { background: rgba(255,255,255,0.15); }
    .slide-counter { font-family: 'Jost', sans-serif; font-size: 0.72rem; letter-spacing: 0.18em; color: rgba(247,241,238,0.5); }

    @media (max-width: 600px) {
      .topbar h1 { font-size: 0.9rem; max-width: 38vw; }
      .topbar-btn { padding: 0.35rem 0.55rem; font-size: 0.7rem; }
      .nav-btn { width: 2.2rem; height: 2.2rem; font-size: 1.3rem; }
      .caption-text { font-size: 0.95rem; }
    }
  </style>
</head>
<body>
  <div class="slideshow-shell">

    <div class="topbar">
      <h1>Suite 2308</h1>
      <div class="topbar-actions">
        <button class="topbar-btn" id="autoplay-btn" type="button">Auto OFF</button>
        <button class="topbar-btn" id="fullscreen-btn" type="button">Fullscreen</button>
        <a class="topbar-btn" href="../gallery.html">← Gallery</a>
      </div>
    </div>

    <div class="slide-frame" id="slide-frame">
      <div class="caption-overlay" id="caption-overlay" style="display:none">
        <div class="caption-text" id="caption"></div>
      </div>
    </div>

    <div class="bottom-bar">
      <button class="nav-btn" id="prev-btn" aria-label="Previous">‹</button>
      <span class="slide-counter" id="slide-number">1 / 1</span>
      <a class="nav-btn" id="download-btn" title="Download" aria-label="Download">⬇</a>
      <button class="nav-btn" id="next-btn" aria-label="Next">›</button>
    </div>

  </div>

  <script>
    (function () {
      var galleryTitle = 'Suite 2308';
      var assetFolder  = '../assets/Suite-2308/';
      var galleryMeta  = 'Digital, 2024 · Tokyo, Japan';

      var filenames = [
        '1HljdxGfPcJPvElnGfMnvHQN-5DZsEUMh.png',
        '1ihHC1tcJHsnl-92Q_80pm6oESOXE_DeN.png',

        '1lpiV4CDEQEkmmtQZERx-7iXeaNdNtIM9.png',
        '1Aj1uN_WOkkAG90hKg7nVxu8N_VxaaEyl.png',
        '1BBpbWnYf_FG50LAk-jnqDHwS_Cgst6dy.png',
        '13MZbejic4196TYw73VzQh-9azNHlX11W.png',

        '1L-_vSLGXo6a_MJKVOXLFQL9dHRmss7A8.png',
        '1V-txQCsNCrlvYFjoK976fXysX2aaMp8f.png',

        '1EMqImkRkeFyiNzCN2330hFr0MjF4TTVS.png',
        '15BlFI_gdcu0jwc9uvcbpBS8jEH5D9itg.png',
        '1J1RJh-wcOc2aajTbVTPzlzV7FZv9nVD8.png',
        '1rpGDh8-1jjcRcy4YbtpVqSiX5qnS3D4T.png',
        '1yOxhBDMqGumnbQTbHjnqqOVTegrISra_.png',
        '1qw0pBDYw3t7FLlidJrS9mrXAWZySig48.png',
        '186dbwF1WyqidXuYmAJ-z1lDTierL-Thf.png',
        '15XWPnbfTQ0jg-Oy9iQJGcp3-iCJr94iB.png',
        '1lZvfL7yGOto2fmFPCF0srtxTnsdOXJc7.png',
        '1C-CcUMM7jj1r6Eiwh2yRIb_rWSEcfOUz.jpg'
      ];

      var captions = [
        'The whole city lit up behind you, and all I could see was you. That look you give me — like you already know what I\'m thinking.',
        'Leaning into the night like it belongs to you. The lace, the city, those eyes... there\'s no version of this moment I\'d trade.',
        'You stepped out in that ivory lace and the entire skyline became backdrop. You\'ve always been the main attraction.',
        'Champagne silk against a million city lights. You look like a dream I keep choosing to stay inside.',
        'The amber light behind you, the way your hands rest — soft and certain. There\'s nowhere I\'d rather come home to.',
        'Neon signs and a midnight skyline, and you standing there like none of it compares to you. It doesn\'t.',
        'The whole city spread out like an offering behind you — and you lean on that railing like a woman who\'s earned every view she takes.',
        '\'One more thing,\' you say — and whatever it is, the answer is already yes. That smile knows exactly what it does to me.',
        'You pressed your hand to the window and looked out like you were reading the city\'s secrets. I was reading you.',
        'Silk from shoulder to ankle, a city tower glowing just for you. You sat like royalty and looked at me like I was the view.',
        'You touched the frame like you were holding the night still. I wanted to hold you still. Just like that. Forever.',
        'Half warm light, half cold city — and all of you impossibly beautiful between them. The contrast never stood a chance.',
        'Hand at your chin, eyes just past the lens — thinking something I want you to say out loud. Take your time. I\'m not going anywhere.',
        'Barefoot on hotel sheets in a full silk set, with the city lit up behind you. You made the suite feel like a world I never want to leave.',
        'Tokyo Tower burning orange behind you, you sitting on the bed like a painting. I\'ve never been more grateful to be in the same room.',
        'Legs crossed, shoes off, completely at ease — and still the most stunning woman in any room, any city, any hour.',
        'That easy confidence — one knee up, chin tilted, like you\'re deciding whether to let me stare a little longer. Please. Let me.',
        'The city turned blue behind you and you sat there glowing against it. Effortless. Every single time.',
        'You picked up those chopsticks and looked at me like a question I\'d spend all night answering. Yes. Always yes.',
        'Early morning light pushing through the curtains, you sitting on the bed like you haven\'t decided yet if the day gets to start. Stay.',
        'The sash still in your hand, the city just beginning to darken outside — and that smile that says you know exactly how this night ends.',
        'You ran your fingers through your hair and the lamplight caught every strand. I caught my breath.',
        'That playful tilt, the way you hold the brush like a secret. You\'re thinking something mischievous and I love every second of it.',
        'You look at me like that and every coherent thought I had just... leaves. Stay exactly as you are.',
        'That smirk. You know what that smirk does. You\'ve always known.',
        'One finger hooked on the strap, eyes holding mine — you could pull the whole world undone with a look like that.',
        'The lamp behind you warm and low, your smile even warmer. The city outside had no idea how much light was inside this room.',
        'You looked straight through the camera and into something only I\'m supposed to see. I\'ll keep it safe.',
        'Finger to your lips — half shush, half invitation. Either way I\'m listening. I\'m always listening to you.',
        'No pose, no pretense. Just you, at ease in the room we shared, looking like everything I wanted to come back to.',
        'There\'s something about the way you sit when you think no one\'s watching — open, unhurried, entirely yourself. That version of you undoes me.',
        'Champagne silk against cold marble, gold doors behind you — you made the hotel look like it was dressed for you.',
        'That blush lace, that touch at the strap — like you\'re about to say something or undo something. My heart can\'t pick which it wants more.',
        'Every time I turn a corner and see you, it hits the same. Like the first time. Like I never get used to how beautiful you are.',
        'A thin gold necklace, a delicate bracelet, silk the color of warm sand — and that look like you\'ve been waiting for me to notice. I always notice.',
        'You glanced back over your shoulder in that hallway and the whole hotel fell away. Just you, just that look, just that curve of your smile.',
        'You were walking away and looked back — and I realized I\'d follow that look anywhere it led.',
        'Half-turned at the door, the amber corridor stretching behind you, gold silk on your skin — you looked like a secret I was lucky enough to know.',
        'Head to toe in gold silk, walking through that corridor like the whole night was choreographed just for this. For you. It was.',
        'Two lamps trying to compete with you. They lost.',
        'Tokyo Skytree rising blue into the night, and you — white lace, dark eyes, soft mouth — outshining every light in the frame.',
        'The city never sleeps and neither does the way I feel standing across a room from you. Tokyo in the window. You in the light. Perfect.',
        'Black lace, a sliver of skin, and the whole electric city spread out beneath you. You smiled at me and I forgot every skyline I\'ve ever seen.'
      ];

      document.title = galleryTitle + ' · Sheryl Joyce';
      document.querySelector('.topbar h1').textContent = galleryTitle;

      var frame       = document.getElementById('slide-frame');
      var captionEl   = document.getElementById('caption');
      var captionWrap = document.getElementById('caption-overlay');
      var numberEl    = document.getElementById('slide-number');
      var downloadBtn = document.getElementById('download-btn');
      var current     = 0;
      var autoplayTimer = null;
      var slides      = [];
      var videoExts   = ['mp4', 'mov', 'webm', 'm4v', 'avi'];

      filenames.forEach(function (filename, index) {
        var slide = document.createElement('div');
        slide.className = 'slide' + (index === 0 ? ' active' : '');
        var ext = filename.split('.').pop().toLowerCase();
        var media;
        if (videoExts.indexOf(ext) !== -1) {
          media = document.createElement('video');
          media.src = assetFolder + encodeURIComponent(filename);
          media.controls = true;
        } else {
          media = document.createElement('img');
          media.src = assetFolder + encodeURIComponent(filename);
          media.alt = galleryTitle + ' ' + (index + 1);
        }
        slide.appendChild(media);
        frame.appendChild(slide);
        slides.push(slide);
      });

      function updateSlide(index) {
        if (!slides.length) { return; }
        slides[current].classList.remove('active');
        current = (index + slides.length) % slides.length;
        slides[current].classList.add('active');
        var cap = captions[current] || '';
        captionEl.textContent = cap;
        captionWrap.style.display = cap ? '' : 'none';
        numberEl.textContent = (current + 1) + ' / ' + slides.length;
        var src = assetFolder + encodeURIComponent(filenames[current]);
        downloadBtn.href = src;
        downloadBtn.setAttribute('download', filenames[current]);
      }

      function advance(index) {
        updateSlide(index);
        if (autoplayTimer) { stopAutoplay(); startAutoplay(); }
      }

      document.getElementById('prev-btn').addEventListener('click', function () { advance(current - 1); });
      document.getElementById('next-btn').addEventListener('click', function () { advance(current + 1); });

      var autoplayBtn   = document.getElementById('autoplay-btn');
      var fullscreenBtn = document.getElementById('fullscreen-btn');

      function startAutoplay() {
        if (autoplayTimer) { return; }
        autoplayBtn.textContent = 'Auto ON';
        autoplayTimer = setInterval(function () { advance(current + 1); }, 7000);
      }
      function stopAutoplay() {
        clearInterval(autoplayTimer);
        autoplayTimer = null;
        autoplayBtn.textContent = 'Auto OFF';
      }
      autoplayBtn.addEventListener('click', function () {
        autoplayTimer ? stopAutoplay() : startAutoplay();
      });

      function toggleFullscreen() {
        var shell = document.querySelector('.slideshow-shell');
        if (document.fullscreenElement) { document.exitFullscreen(); return; }
        (shell.requestFullscreen || shell.webkitRequestFullscreen).call(shell);
      }
      fullscreenBtn.addEventListener('click', toggleFullscreen);
      document.addEventListener('fullscreenchange', function () {
        fullscreenBtn.textContent = document.fullscreenElement ? 'Exit Full' : 'Fullscreen';
      });

      window.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowLeft')           { advance(current - 1); }
        if (e.key === 'ArrowRight')          { advance(current + 1); }
        if (e.key === 'f' || e.key === 'F') { toggleFullscreen(); }
      });

      updateSlide(0);
    })();
  </script>
</body>
</html>
