<!DOCTYPE html>
<!-- HAND-MAINTAINED — do not overwrite in auto-rebuild (build_site_actions.py skips this file) -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Chapter 00 — The Threshold · Sheryl Joyce">
  <title>Chapter 00 — The Threshold · Sheryl Joyce</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #0c0a09;
      overflow-x: hidden;
    }
    body { font-family: 'Jost', Georgia, sans-serif; }

    /* ── Fixed nav ── */
    .thr-nav-vip {
      position: fixed;
      top: 1.3rem;
      left: 1.5rem;
      z-index: 300;
      font-family: 'Jost', sans-serif;
      font-size: 0.6rem;
      font-weight: 300;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      text-decoration: none;
      padding: 0.42em 0.95em;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 2px;
      transition: color 0.25s, border-color 0.25s;
    }
    .thr-nav-vip:hover { color: rgba(255,255,255,0.85); border-color: rgba(255,255,255,0.38); }
    .thr-nav-vip:focus-visible { outline: 2px solid rgba(255,255,255,0.5); outline-offset: 3px; }

    .thr-skip {
      position: fixed;
      top: 1.3rem;
      right: 1.5rem;
      z-index: 300;
      font-family: 'Jost', sans-serif;
      font-size: 0.6rem;
      font-weight: 300;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.82);
      text-decoration: none;
      padding: 0.42em 0.95em;
      background: rgba(10, 8, 7, 0.58);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: color 0.25s, background 0.25s;
    }
    .thr-skip:hover { color: #fff; background: rgba(10, 8, 7, 0.82); }
    .thr-skip:focus-visible { outline: 2px solid rgba(255,255,255,0.6); outline-offset: 3px; }

    /* ── Frames ── */
    .thr-frame {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    @supports (min-height: 100svh) { .thr-frame { min-height: 100svh; } }

    /* Opening text */
    .thr-frame--text {
      background: #0c0a09;
      padding: 5rem 2rem;
    }
    .thr-text-center {
      text-align: center;
      max-width: 460px;
      padding: 0 1rem;
    }
    .thr-overline {
      font-family: 'Jost', sans-serif;
      font-size: 0.64rem;
      font-weight: 300;
      letter-spacing: 0.52em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.36);
      margin: 0 0 1.5em;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 1.2s ease, transform 1.2s ease;
    }
    .thr-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(2.6rem, 9vw, 5.2rem);
      line-height: 1.02;
      color: #f4ede6;
      margin: 0 0 1rem;
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 1.4s ease 0.18s, transform 1.4s ease 0.18s;
    }
    .thr-body-text {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(0.97rem, 2.4vw, 1.18rem);
      line-height: 1.8;
      color: rgba(244, 237, 230, 0.62);
      margin: 0;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 1.4s ease 0.38s, transform 1.4s ease 0.38s;
    }

    /* Image frames */
    .thr-frame--img { background: #0c0a09; }
    .thr-img-wrap { position: absolute; inset: 0; overflow: hidden; }
    .thr-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transform: scale(1.04);
      transition: opacity 1.8s ease, transform 10s ease;
    }
    .thr-veil {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: linear-gradient(
        to bottom,
        rgba(10, 8, 7, 0.38) 0%,
        rgba(10, 8, 7, 0.04) 28%,
        rgba(10, 8, 7, 0.02) 58%,
        rgba(10, 8, 7, 0.60) 100%
      );
    }
    .thr-frame--reveal .thr-veil {
      background: linear-gradient(
        to bottom,
        rgba(10, 8, 7, 0.20) 0%,
        rgba(10, 8, 7, 0.0) 36%,
        rgba(10, 8, 7, 0.0) 58%,
        rgba(10, 8, 7, 0.48) 100%
      );
    }

    /* Aside text overlay */
    .thr-aside {
      position: absolute;
      bottom: 11%;
      left: 0; right: 0;
      z-index: 2;
      text-align: center;
      padding: 0 2rem;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(1rem, 2.8vw, 1.38rem);
      color: rgba(244, 237, 230, 0.9);
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.68);
      margin: 0;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 1.4s ease 0.65s, transform 1.4s ease 0.65s;
    }

    /* Cue / enter frame */
    .thr-frame--cue {
      min-height: 26vh;
      background: #0c0a09;
    }
    .thr-enter {
      display: inline-block;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(1.1rem, 3vw, 1.48rem);
      letter-spacing: 0.1em;
      color: rgba(244, 237, 230, 0.62);
      text-decoration: none;
      border-bottom: 1px solid rgba(244, 237, 230, 0.26);
      padding-bottom: 3px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 1.2s ease, transform 1.2s ease, color 0.3s, border-color 0.3s;
    }
    .thr-enter:hover { color: #f4ede6; border-bottom-color: rgba(244, 237, 230, 0.68); }
    .thr-enter:focus-visible { outline: 2px solid rgba(244, 237, 230, 0.5); outline-offset: 6px; }

    /* Active states */
    .thr-frame.is-active .thr-overline,
    .thr-frame.is-active .thr-title,
    .thr-frame.is-active .thr-body-text { opacity: 1; transform: translateY(0); }
    .thr-frame.is-active .thr-img { opacity: 1; transform: scale(1.0); }
    .thr-frame.is-active .thr-aside,
    .thr-frame.is-active .thr-enter { opacity: 1; transform: translateY(0); }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .thr-overline, .thr-title, .thr-body-text,
      .thr-img, .thr-aside, .thr-enter {
        opacity: 1 !important;
        transform: none !important;
        transition: none !important;
      }
    }

    /* Mobile */
    @media (max-width: 700px) {
      .thr-frame--text { padding: 3.5rem 1.5rem; }
      .thr-aside { bottom: 7%; padding: 0 1.2rem; }
      .thr-nav-vip { top: 1rem; left: 1rem; font-size: 0.56rem; letter-spacing: 0.22em; padding: 0.38em 0.8em; }
      .thr-skip { top: 1rem; right: 1rem; font-size: 0.56rem; letter-spacing: 0.22em; padding: 0.38em 0.8em; }
    }

    /* Desktop: portrait images on cinematic dark stage */
    @media (min-width: 769px) {
      .thr-frame--img {
        display: grid;
        place-items: center;
        padding: clamp(3rem, 6vw, 6rem);
        background:
          radial-gradient(ellipse at 50% 46%, rgba(255, 248, 240, 0.045) 0%, transparent 58%),
          #17191c;
      }
      .thr-frame--img .thr-img-wrap {
        position: static;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: visible;
        inset: auto;
      }
      .thr-frame--img .thr-img {
        width: auto;
        height: auto;
        max-width: min(72vw, 760px);
        max-height: 86vh;
        object-fit: contain;
        object-position: center;
        box-shadow: 0 2px 6px rgba(0,0,0,0.28), 0 24px 70px rgba(0,0,0,0.42);
      }
      .thr-frame--img .thr-veil { display: none; }
      .thr-frame--with-aside .thr-aside {
        bottom: 4%;
        font-size: clamp(0.95rem, 1.5vw, 1.22rem);
      }
    }
  </style>
</head>
<body>

  <a href="vip.html" class="thr-nav-vip" aria-label="VIP members area">VIP</a>
  <a href="gallery.html" class="thr-skip" aria-label="Skip introduction and go directly to the gallery">Skip to Gallery</a>

  <!-- ─── Frame 0: Opening text ─── -->
  <div class="thr-frame thr-frame--text">
    <div class="thr-text-center">
      <p class="thr-overline">CHAPTER 00</p>
      <h1 class="thr-title">The Threshold</h1>
      <p class="thr-body-text">Some galleries begin with a photograph.<br>This one begins with an arrival.</p>

  <div class="thr-frame thr-frame--img" data-frame="1">

      <img
        src="assets/Entryway/Entryway__%2017.png"

      >

  <div class="thr-frame thr-frame--img" data-frame="2">

        alt="Seen from behind in a sun-lit colonnade corridor, she looks into the architectural space ahead"

      >

  <!-- ─── Frame 3: Walking, hair mid-motion ─── -->
  <div class="thr-frame thr-frame--img" data-frame="3">
    <div class="thr-img-wrap">
      <img
        src="assets/Entryway/Entryway__%209.png"

  <!-- ─── Frame 4: Full stride along columns ─── -->
  <div class="thr-frame thr-frame--img" data-frame="4">
    <div class="thr-img-wrap">
      <img
        src="assets/Entryway/Entryway__%2012.png"
        alt="Full stride along architectural columns — the corridor stretches behind her, elevator receding"
        class="thr-img"
        style="object-position: center top;"
        loading="lazy"
      >
    </div>

  </div>

  <!-- ─── Frame 5: Approaching glass doors + pivot text ─── -->
  <div class="thr-frame thr-frame--img thr-frame--with-aside" data-frame="5">

      <img

  <!-- ─── Frame 7: THE REVEAL — both women, hands clasped ─── -->
  <div class="thr-frame thr-frame--img thr-frame--reveal" data-frame="7">

  <!-- ─── Cue frame: Enter the Collection ─── -->
  <div class="thr-frame thr-frame--cue">
    <a href="gallery.html" class="thr-enter">Enter the Collection</a>
  </div>

  <script>
    (function () {
      var frames = document.querySelectorAll('.thr-frame');
      if (!frames.length) return;
      var obs = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) e.target.classList.add('is-active');
        });
      }, { threshold: 0.12 });
      frames.forEach(function (f) { obs.observe(f); });
    })();
  </script>
